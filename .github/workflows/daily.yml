# Daily scrape + GitHub Pages publish for https://ofirr-op.github.io/leasing-deals/
name: Daily scrape and publish

on:
  schedule:
    # 04:00 UTC = 06:00 IST in winter, 07:00 IDT in summer
    - cron: "0 4 * * *"
  workflow_dispatch:
  # One-shot starter. workflow_dispatch is not available to the integration
  # token, and snapshot commits do not touch this path, so they cannot loop.
  push:
    branches: [main]
    paths:
      - ".github/dispatch-daily"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # schedule and workflow_dispatch re-runs keep the original head_sha
          # when ref is omitted, so a later push is not a fast-forward.
          # A branch name fetches the current tip of main.
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape current offers
        env:
          TZ: Asia/Jerusalem
        run: |
          # A failed source keeps its previous offers inside scrape.py and the
          # process still exits 0. A hard failure (nothing to publish) must not
          # fail the job or replace history with an empty snapshot.
          if python scrape.py; then
            echo "Scrape finished"
          else
            echo "Scrape failed; restoring previous history snapshots"
            git checkout -- data/history || true
            git clean -fd -- data/history || true
          fi

      - name: Build the site
        env:
          TZ: Asia/Jerusalem
        run: python build_site.py

      - name: Commit snapshot and generated site
        env:
          TZ: Asia/Jerusalem
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/history is append-only: each scan is a new timestamped file.
          # docs/ includes docs/data/history.json and history.js (the chart series).
          git add data/history docs
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily snapshot $(date +%F)"

          branch="$(git branch --show-current)"
          if [ -z "$branch" ]; then
            echo "Checkout is detached; refusing to push"
            exit 1
          fi

          # main may have moved during the scrape, or this run may have been
          # queued behind another publish. Fetch, rebase onto the tip, and
          # retry the push. Never force-push. History files are append-only;
          # if generated docs conflict, keep every snapshot and rebuild.
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin "$branch"; then
              echo "Fetch failed (attempt ${attempt}); retrying"
              sleep $((attempt * 5))
              continue
            fi
            if ! git merge-base --is-ancestor "origin/$branch" HEAD; then
              if ! git rebase "origin/$branch"; then
                conflicted="$(git diff --name-only --diff-filter=U || true)"
                if printf '%s\n' "$conflicted" | grep -q '^data/history/'; then
                  echo "Refusing to resolve a conflict in append-only history:"
                  printf '%s\n' "$conflicted"
                  git rebase --abort
                  exit 1
                fi
                other="$(printf '%s\n' "$conflicted" | grep -v '^docs/' || true)"
                if [ -n "$other" ]; then
                  echo "Unexpected rebase conflict:"
                  printf '%s\n' "$conflicted"
                  git rebase --abort
                  exit 1
                fi
                git checkout --ours -- docs
                git add docs data/history
                GIT_EDITOR=true git rebase --continue
              fi
              python build_site.py
              git add docs
              if ! git diff --staged --quiet; then
                git commit --amend --no-edit
              fi
            fi
            if git push origin "HEAD:${branch}"; then
              echo "Pushed snapshot to ${branch}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); fetching and retrying"
            sleep $((attempt * 5))
          done
          echo "Failed to push snapshot after retries"
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
